<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | ReWear</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">ReWear</a>
        <nav class="nav-menu">
          <a href="index.html">Home</a>
             <a href="login.html">Login</a>
         <!--- <a href="shop.html">Shop</a>-->
       
        </nav>
      </div>
    </header>

    <main class="auth-shell">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="muted">Login to continue your ReWear journey</p>
        <form id="loginForm">
          <label>Email</label>
          <input id="loginEmail" type="email" required />
          <label>Password</label>
          <input id="loginPassword" type="password" required />
          <button class="btn btn-primary" type="submit">Login</button>
        </form>
        <p class="small-link">Need an account? <a href="register.html">Create an account</a></p>
      </div>
    </main>

    <div id="toastContainer" class="toast-container"></div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/rentals.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
