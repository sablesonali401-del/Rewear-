<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | ReWear</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">ReWear</a>
        <button class="nav-toggle" id="navToggle">☰</button>
        <nav class="nav-menu" id="navMenu">
          <a href="customer-dashboard.html">Dashboard</a>
          <a href="profile.html">Profile</a>
          <a href="#" data-logout>Logout</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="section">
        <div class="container auth-card wide">
          <h1>Profile</h1>
          <form id="profileForm">
            <div class="form-grid">
              <div>
                <label>Name</label>
                <input id="profileName" type="text" required />
              </div>
              <div>
                <label>Email</label>
                <input id="profileEmail" type="email" readonly />
              </div>
              <div>
                <label>Phone</label>
                <input id="profilePhone" type="tel" required />
              </div>
              <div>
                <label>Password</label>
                <input id="profilePassword" type="password" placeholder="Leave blank to keep current" />
              </div>
            </div>
            <label>Address</label>
            <textarea id="profileAddress" required></textarea>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
      </section>
    </main>

    <div id="toastContainer" class="toast-container"></div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/rentals.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
