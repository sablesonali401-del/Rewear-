<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | ReWear</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand">ReWear</a>
        <button class="nav-toggle" id="navToggle">☰</button>
        <nav class="nav-menu" id="navMenu">
          <a href="owner-dashboard.html" data-auth-link="owner">Dashboard</a>
          <a href="shop.html">Shop</a>
          <a href="login.html" data-auth-link="login">Login</a>
          <a href="customer-dashboard.html" data-auth-link="customer">Dashboard</a>
          <a href="admin-dashboard.html" data-auth-link="admin">Admin</a>
          <a href="#" data-auth-link="logout" data-logout>Logout</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="section page-intro">
        <div class="container">
          <div class="section-heading">
            <span class="eyebrow">Marketplace</span>
            <h1>Shop Pre-Loved Fashion</h1>
          </div>
          <div class="shop-controls">
            <input id="shopSearch" type="text" placeholder="Search by name, brand or category" />
            <select id="categoryFilter">
              <option value="All">All Categories</option>
              <option value="Men">Men</option>
              <option value="Women">Women</option>
              <option value="Kids">Kids</option>
              <option value="Dresses">Dresses</option>
              <option value="Shirts">Shirts</option>
              <option value="T-Shirts">T-Shirts</option>
              <option value="Jeans">Jeans</option>
              <option value="Jackets">Jackets</option>
              <option value="Traditional Wear">Traditional Wear</option>
              <option value="Other">Other</option>
            </select>
            <select id="sizeFilter">
              <option value="All">All Sizes</option>
              <option value="XS">XS</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
            </select>
            <select id="conditionFilter">
              <option value="All">All Conditions</option>
              <option value="Excellent">Excellent</option>
              <option value="Very Good">Very Good</option>
              <option value="Good">Good</option>
            </select>
            <select id="priceFilter">
              <option value="5000">Up to ₹5000</option>
              <option value="2000">Up to ₹2000</option>
              <option value="3000">Up to ₹3000</option>
              <option value="4000">Up to ₹4000</option>
              <option value="5000">Up to ₹5000</option>
            </select>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div id="shopGrid" class="product-grid"></div>
        </div>
      </section>

      <div class="cart-float shop-cart-float">
        <div class="cart-panel-group">
          <button type="button" class="cart-toggle" id="cartToggle" aria-expanded="false">
            Cart <span id="cartCount">0</span>
          </button>
          <button type="button" class="cart-toggle cart-toggle-secondary" id="favoritesToggle" aria-expanded="false">
            Favorites <span id="favoritesCount">0</span>
          </button>
        </div>
        <section class="cart-panel" id="cartPanel" aria-label="Shopping cart">
          <div class="cart-header"><strong>Your cart</strong></div>
          <div class="cart-items" id="cartItems"></div>
          <div class="cart-footer">
            <span>Total</span>
            <strong id="cartTotal">₹0</strong>
          </div>
          <button type="button" class="btn btn-secondary btn-small" id="clearCartBtn">Clear cart</button>
        </section>
        <section class="cart-panel" id="favoritesPanel" aria-label="Favorite products">
          <div class="cart-header"><strong>Your favorites</strong></div>
          <div class="cart-items" id="favoriteItems"></div>
          <button type="button" class="btn btn-secondary btn-small" id="clearFavoritesBtn">Clear favorites</button>
        </section>
      </div>
    </main>


      
    <footer class="site-footer">
      <div class="container footer-grid">
        <div><h3>ReWear</h3><p>Second-hand fashion for a better tomorrow.</p></div>
      </div>
    </footer>

    <div id="toastContainer" class="toast-container"></div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/rentals.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
